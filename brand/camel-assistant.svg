  <!-- far ear cup (behind the head) -->
  <rect x="28.6" y="6.4" width="6" height="8" rx="3" fill="#24544B"/>
  <!-- curved neck + head -->
  <path fill="#A4643C" d="M12.6 48c-.4-6.4.6-11.3 2-15.8 1.2-3.9.2-7.6.4-10.8.4-6 4.6-10.2 10.6-10.2 4.4 0 7.8 1.8 10.2 4.4l4.6 4.8c1.9 2 2.4 4.6 1.4 6.8-.9 2-2.8 3.1-5.2 3.1h-4c-2.6 0-4.4 1.6-5.2 4.3L24.6 48z"/>
  <!-- rounded droopy muzzle with split upper lip -->
  <path fill="#8A5230" d="M33.8 18.6l5.4 5.2c1.4 1.5 1.6 3.3.7 4.6-.8 1.1-2.2 1.6-3.9 1.6h-4.6c1.8-3.3 2.6-7.4 2.4-11.4z"/>
  <path d="M37.2 26.2c-.4 1.3-.4 2.4.1 3.4" stroke="#5E3219" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M32.4 30c1.8.9 3.6 1 5 .3" stroke="#5E3219" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <ellipse cx="38.6" cy="22.3" rx="1" ry=".65" fill="#5E3219" transform="rotate(35 38.6 22.3)"/>
  <!-- eye with long lashes -->
  <ellipse cx="27.2" cy="17.2" rx="1.7" ry="1.5" fill="#2A160B"/>
  <circle cx="27.7" cy="16.7" r=".5" fill="#F1E7D6"/>
  <path d="M25.3 15.4l-1-1.1M27.1 14.9l-.2-1.3M28.9 15.3l.7-1.1" stroke="#2A160B" stroke-width=".85" stroke-linecap="round"/>
  <!-- small round ear -->
  <path fill="#8A5230" d="M18.6 12.3c-1.3-1.2-1.6-2.9-.6-3.8 1.3.3 2.3 1.8 2.4 3.3z"/>
  <!-- headphone band -->
  <path d="M15.2 15.6C14.4 7.6 20.4 3.4 26.4 3.9c4.4.4 6.8 2.6 6 6.6" stroke="#2F6B60" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- near ear cup -->
  <rect x="10.6" y="14" width="9" height="12" rx="4.5" fill="#2F6B60"/>
  <rect x="12.6" y="16.2" width="5" height="7.6" rx="2.5" fill="#6FB3A3"/>
</svg>
